<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#996515" stop-opacity="0" />
    </radialGradient>
    <filter id="sniperGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark tactical badge background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#13161c" stroke="url(#goldGrad)" stroke-width="1.5" />
  
  <!-- Outer precision ring -->
  <circle cx="32" cy="32" r="23" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.6" />
  
  <!-- Dual sniper reticles -->
  <circle cx="26" cy="32" r="14" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="38" cy="32" r="14" stroke="url(#goldGrad)" stroke-width="2" />
  
  <!-- Optical crosshairs -->
  <g stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round">
    <!-- Center vertical crosshairs -->
    <line x1="32" y1="10" x2="32" y2="18" />
    <line x1="32" y1="46" x2="32" y2="54" />
    
    <!-- Left & Right crosshairs -->
    <line x1="6" y1="32" x2="14" y2="32" />
    <line x1="50" y1="32" x2="58" y2="32" />
    
    <!-- Sub-reticle vertical sights -->
    <line x1="26" y1="14" x2="26" y2="19" opacity="0.7" />
    <line x1="26" y1="45" x2="26" y2="50" opacity="0.7" />
    <line x1="38" y1="14" x2="38" y2="19" opacity="0.7" />
    <line x1="38" y1="45" x2="38" y2="50" opacity="0.7" />
  </g>
  
  <!-- Corner tactical corner markers -->
  <path d="M8 16 V8 H16" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <path d="M56 16 V8 H48" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <path d="M8 48 V56 H16" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <path d="M56 48 V56 H48" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

  <!-- Center Laser Target Bead -->
  <circle cx="32" cy="32" r="4.5" fill="url(#goldGlow)" />
  <circle cx="32" cy="32" r="2.5" fill="#FFF275" filter="url(#sniperGlow)" />
</svg>
